<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cocina · Comal Dorado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Caveat+Brush&family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--carbon:#14100d;--carbon2:#1f1812;--crema:#fff6df;--tinta:#2a1d12;--maiz:#ffc83d;--chile:#e8412c;--curtido:#8bc34a;
  --display:'Bowlby One',Impact,sans-serif;--hand:'Caveat Brush',cursive;--body:'Outfit',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--carbon);color:var(--crema);font-family:var(--body);font-size:20px;min-height:100vh}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}
header{display:flex;flex-wrap:wrap;align-items:center;gap:14px 28px;padding:16px 28px;background:var(--carbon2);border-bottom:4px solid var(--maiz)}
header h1{font-family:var(--display);font-size:1.6rem;color:var(--maiz)}
.stats{display:flex;gap:26px;margin-left:auto}
.stats div{display:flex;flex-direction:column;line-height:1.1}
.stats b{font-family:var(--display);font-size:1.8rem;color:var(--curtido)}
.stats span{font-size:.8rem;opacity:.7}
.comal-list{padding:14px 28px;background:#2a1d12;display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-height:62px}
.comal-list h2{font-family:var(--hand);font-size:1.6rem;color:var(--maiz);margin-right:8px}
.tag{background:var(--maiz);color:var(--tinta);border-radius:999px;padding:4px 16px;font-weight:700}
.tag b{font-family:var(--display);margin-right:6px;color:var(--chile)}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding:24px 28px}
.col h2{font-family:var(--display);font-size:1.3rem;padding:12px 18px;border-radius:16px 16px 0 0;display:flex;justify-content:space-between}
.col.nuevo h2{background:var(--chile)}.col.preparando h2{background:var(--maiz);color:var(--tinta)}.col.listo h2{background:var(--curtido);color:var(--tinta)}
.col-body{display:flex;flex-direction:column;gap:16px;padding:16px 0}
.ped{background:var(--crema);color:var(--tinta);border-radius:20px;padding:18px 20px;border:4px solid var(--tinta);box-shadow:6px 6px 0 #000}
.ped.fresh{animation:fresh 1.2s 3}
@keyframes fresh{50%{box-shadow:0 0 0 8px var(--maiz)}}
.ped-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ped-code{font-family:var(--display);font-size:1.4rem;color:var(--chile)}
.ped-time{font-size:.85rem;opacity:.7}
.ped-who{font-weight:700;margin:2px 0 6px}
.ped-who small{font-weight:400;opacity:.75}
.ped ul{list-style:none;margin:8px 0;padding:8px 0;border-block:2px dashed rgba(42,29,18,.3)}
.ped li{font-size:1.25rem;font-weight:500}
.ped li b{font-family:var(--display);color:var(--chile);margin-right:8px}
.ped-note{background:#fff0b8;border-radius:10px;padding:6px 12px;margin:8px 0;font-size:.95rem}
.ped-tot{display:flex;justify-content:space-between;font-weight:700;margin-bottom:12px}
.acts{display:flex;gap:8px}
.acts button{flex:1;border:0;border-radius:14px;padding:12px;font-weight:700;color:#fff;background:var(--chile);box-shadow:0 4px 0 #8f2417}
.acts .ok{background:#2f7d1f;box-shadow:0 4px 0 #1c4d12}
.acts .no{flex:0 0 auto;background:var(--tinta);box-shadow:0 4px 0 #000;font-size:.9rem}
.vacio{font-family:var(--hand);font-size:1.5rem;opacity:.5;padding:20px 4px}
.hist{padding:0 28px 40px}
.hist summary{cursor:pointer;font-family:var(--hand);font-size:1.6rem;color:var(--maiz);margin-bottom:12px}
.hist-row{display:flex;gap:16px;padding:8px 0;border-bottom:1px solid rgba(255,246,223,.15);font-size:.95rem}
.hist-row span:first-child{font-family:var(--display);width:100px;color:var(--maiz)}
.login{position:fixed;inset:0;background:rgba(10,7,5,.95);display:grid;place-items:center;z-index:10}
.login form{background:var(--crema);color:var(--tinta);padding:34px;border-radius:26px;border:4px solid var(--maiz);box-shadow:10px 10px 0 var(--chile);width:min(380px,92vw);text-align:center}
.login h2{font-family:var(--display);margin-bottom:6px}
.login input{width:100%;margin:14px 0;padding:14px;font-size:1.6rem;text-align:center;letter-spacing:8px;border:3px solid var(--tinta);border-radius:14px}
.login button{width:100%;border:0;border-radius:999px;padding:14px;background:var(--chile);color:#fff;font-weight:700;box-shadow:0 5px 0 #8f2417}
.login p{color:var(--chile);min-height:1.4em;font-size:.95rem}
@media (max-width:1000px){.board{grid-template-columns:1fr}.stats{margin-left:0}}
</style>
</head>
<body>
<div class="login" id="login">
  <form id="loginForm">
    <h2>Cocina</h2>
    <label for="pin">Escribe el PIN del personal</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" required autofocus>
    <p id="loginErr"></p>
    <button type="submit">Entrar</button>
  </form>
</div>

<header>
  <h1>Cocina · <span id="nombre">Comal Dorado</span></h1>
  <div class="stats">
    <div><b id="stPend">0</b><span>pedidos pendientes</span></div>
    <div><b id="stHoy">0</b><span>pedidos hoy</span></div>
    <div><b id="stVend">$0.00</b><span>vendido hoy</span></div>
  </div>
</header>

<div class="comal-list"><h2>Para el comal:</h2><span id="paraComal"></span></div>

<main class="board">
  <section class="col nuevo"><h2>Nuevos <span id="cN">0</span></h2><div class="col-body" id="colNuevo"></div></section>
  <section class="col preparando"><h2>En el comal <span id="cP">0</span></h2><div class="col-body" id="colPrep"></div></section>
  <section class="col listo"><h2>Listos <span id="cL">0</span></h2><div class="col-body" id="colListo"></div></section>
</main>

<details class="hist"><summary>Historial reciente</summary><div id="hist"></div></details>

<script src="js/cocina.js"></script>
</body>
</html>
